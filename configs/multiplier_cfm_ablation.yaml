# Shared analytic/direct-head ablations for RTX A6000. Select with --variant.
# Direct-head comparison: B, B_direct, D, D_direct. All use identical pairs.
seed: 42
device: auto
cpu_threads: 1
outdir: runs/multiplier_cfm_ablation
cache_dir: runs/multiplier_cfm_ablation/shared_data
variant: D
physics:
  y_ground: 0.0
  xy_limit: 10.0
  slop: 0.005
  contact_margin: 0.25
  density: 1.0
dynamics:
  time_step: 0.0166666667
  gravity_y: -9.8
  linear_damping: 0.1
reference:
  eta_fraction: 0.9
  qp_tolerance: 0.0000001
  max_sweeps: 10000
data:
  # All sizes occur in training; split seeds generate held-out scenes.
  train_sizes: [3, 5, 8, 10]
  val_sizes: [3, 5, 8, 10]
  test_sizes: [3, 5, 8, 10]
  train_per_size: 2048
  val_per_size: 128
  test_per_size: 128
  # Auxiliary scene counts apply separately to every split.
  release_count: 128
  floor_count: 128
  sources_per_scene: 24       # Four samples per each of the six source modes.
  reference_batch_size: 256  # CPU float64 labels; independent of GPU batch size.
model:
  head_type: analytic        # B_direct/D_direct select signed direct velocity.
  hidden_dim: 64
  message_steps: 3
  length_scale: 0.1
  feature_version: residual
  communication: global     # A/C select local communication.
  attention_heads: 4
  attention_layers: 2
train:
  epochs: 76                 # Fallback only; max_updates controls the default run.
  max_updates: 30000
  batch_size: 512
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  tau_zero_fraction: 0.1
  tau_min_remaining: 0.001
  solver_validation_every: 1000  # Checked at epoch boundaries (396 updates/epoch).
  validation_calls: [1, 2, 4]
  inner_rollout:
    weight: 1.0             # A/B/B_direct disable; C/D/D_direct enable.
    calls: [1, 2, 4]         # Sample one budget uniformly per update.
    residual_weight: 1.0
    position_weight: 1.0
  recovery:
    weight: 0.0             # Only D_recovery enables weight 1.0.
    enabled_weight: 1.0     # Weight selected by --variant D_recovery.
    calls: 4
    amplitude: 0.1
    kinds: [independent, correlated]
preflight:
  stack_sizes: [3, 5, 8, 10]
evaluation:
  calls: [1, 2, 4, 8, 16, 32, 64]  # CFM NFE and exactly matching PGS sweep budgets.
  tolerance: 0.001
  position_tolerance: 0.001   # Mass-weighted coordinate RMSE versus FP64 reference.
  max_scenes: 0
  start_modes: [zero, over, mixed]
  guarded: false
  max_backtracks: 12
  timing_repeats: 5           # One warmup, then synchronized solver batch timings.
  render: true
  image_size: 900
  hybrid:
    enabled: true
    calls: [4, 8, 16]        # Complete FM, then PGS to evaluation.tolerance.
                            # Same reference.max_sweeps cap as PGS-only baseline.
  recovery:
    enabled: true
    max_scenes: 16
    calls: [2, 4]
    amplitudes: [0.1]
    start_fractions: [0.5]
    kinds: [independent, correlated]
    seed: 12345
rollout:
  steps: 300
  calls: [1, 2, 4]
  hybrid:
    enabled: true
    calls: [4, 8, 16]        # Adds matching raw FM and three-panel GIFs per K.
  guarded: false
  max_backtracks: 8
  frame_stride: 3
  image_size: 480
  render: true
  max_speed: 100.0
  max_position: 100.0

# Separate synthetic experiment; does not change the original D pair cache or
# training objective. Use train/eval_multiplier_distribution.py.
distribution:
  target: uniform_simplex    # D_distribution_point selects the exact barycenter.
  source_scale: 1.0          # Uniform(0, source_scale * length_scale / D_ii).
  data:
    base_contacts: [2, 4, 8]
    duplicates: [2, 3]
    train_per_setting: 128
    val_per_setting: 4
    test_per_setting: 8
    inverse_mass_range: [0.5, 2.0]
    total_multiplier_range: [0.02, 0.15]
  train:
    max_updates: 10000       # Batch size, lr, weight decay and clipping use train above.
    validate_every: 1000
    validation_samples: 128
    validation_calls: 16
    inner_rollout:
      weight: 1.0
      calls: [1, 2, 4]
      residual_weight: 1.0
      position_weight: 1.0   # Same physical position for every exact multiplier allocation.
  evaluation:
    calls: [4, 8, 16, 32]
    samples_per_qp: 256
    batch_size: 512
    projections: 32          # Conditional empirical sliced Wasserstein-1 directions.
    tolerance: 0.001
    position_tolerance: 0.001
    timing_repeats: 3
    hybrid: false            # Optional: PGS finishing can change the allocation distribution.
    render: true
