# Separate frozen-contact pilot. Existing contact_flow v2 is unchanged.
seed: 42
device: auto
cpu_threads: 1
outdir: runs/multiplier_flow
physics:
  y_ground: 0.0
  xy_limit: 10.0
  slop: 0.005
  contact_margin: 0.25
  density: 1.0
dynamics:
  time_step: 0.0166666667
  gravity_y: -9.8
  linear_damping: 0.1
reference:
  eta_fraction: 0.9             # eta = fraction / lambda_max(D), fixed per problem
  rtol: 0.00001
  atol: 0.00000001
  max_steps: 50000
  qp_tolerance: 0.0000001
  max_sweeps: 10000
data:
  train_sizes: [3, 5]
  val_sizes: [3, 5]
  test_sizes: [8, 10]
  train_per_size: 24
  val_per_size: 8
  test_per_size: 6
  release_count: 4
  segments_per_scene: 5         # zero, under, over, mixed, near-equilibrium
  h_range: [0.25, 256.0]        # finite-time labels, NEVER silently replaced by QP solutions
model:
  hidden_dim: 64
  message_steps: 3
  length_scale: 0.1
train:
  epochs: 100
  batch_size: 64
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  matching_weight: 0.1
preflight:
  stack_sizes: [3, 5, 8]
  times: [1.0, 16.0, 64.0, 256.0, 1024.0]
evaluation:
  total_time: 256.0
  calls: [1, 2, 4, 8]
  tolerance: 0.001
  max_scenes: 16
  start_modes: [zero, over, mixed]
  max_backtracks: 12
  timing_repeats: 3
  render: true
  image_size: 900
