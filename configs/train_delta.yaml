data:
  dataset: data/box2d_next_step.pt
  train_split: train
  val_split: val

train:
  epochs: 300
  batch_size: 1024
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 8

model:
  hidden_dim: 384
  num_layers: 4
  message_steps: 4
  contact_margin: 0.25

runtime:
  seed: 42
  device: cuda
  outdir: runs
  run_name: "a6000_delta"
