# Position-projection solver training.
# model.type can be: delta, fm, grad_fm
data:
  dataset: data/box2d_next_step.pt
  train_split: train
  val_split: val

train:
  epochs: 300
  batch_size: 128
  lr: 0.0003
  weight_decay: 0.0001
  grad_clip: 1.0
  num_workers: 8

model:
  type: grad_fm
  hidden_dim: 256
  time_dim: 64
  num_layers: 3
  message_steps: 4
  contact_margin: 0.25

dynamics:
  time_step: 0.0166666667
  gravity_y: -9.8
  linear_damping: 0.1

loss:
  physics_weight: 0.1
  ground_weight: 1.0
  collision_weight: 1.0
  y_ground: 0.0
  slop: 0.005
  contact_margin: 0.25
  contact_loss_weight: 4.0
  correction_threshold: 0.0001
  position_noise_std: 0.01
  velocity_noise_std: 0.05

runtime:
  seed: 42
  device: cuda
  outdir: runs
  run_name: "projection_grad_fm"
